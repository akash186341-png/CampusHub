<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusHub | Admin Login</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eaf1ff, #f5f7fb);
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 32px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 12px 40px rgba(20, 40, 90, .12);
        }
        .logo {
            width: 58px;
            height: 58px;
            display: grid;
            place-items: center;
            margin: 0 auto 16px;
            border-radius: 16px;
            color: white;
            background: #2457d6;
            font-size: 28px;
            font-weight: bold;
        }
        h1 { margin: 0; text-align: center; color: #17233e; }
        .subtitle {
            text-align: center;
            color: #68738a;
            margin: 10px 0 26px;
        }
        label { display: block; margin: 16px 0 7px; font-weight: 600; color: #26344f; }
        input {
            width: 100%;
            padding: 12px 13px;
            border: 1px solid #d5dbea;
            border-radius: 9px;
            font-size: 15px;
        }
        input:focus { outline: 2px solid #b9ccff; border-color: #2457d6; }
        button {
            width: 100%;
            margin-top: 24px;
            padding: 13px;
            border: 0;
            border-radius: 9px;
            color: white;
            background: #2457d6;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background: #1946b7; }
        .error {
            padding: 10px;
            margin-bottom: 12px;
            color: #9d1c1c;
            background: #fff0f0;
            border-radius: 8px;
        }
        .footer { text-align: center; margin-top: 20px; color: #788298; font-size: 12px; }
    </style>
</head>
<body>
    <main class="login-card">
        <div class="logo">C</div>
        <h1>CampusHub</h1>
        <p class="subtitle">Administrator sign in</p>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('login') }}">
            <label for="username">Admin username</label>
            <input id="username" name="username" type="text"
                   autocomplete="username" required>

            <label for="password">Password</label>
            <input id="password" name="password" type="password"
                   autocomplete="current-password" required>

            <button type="submit">Sign in</button>
        </form>

        <div class="footer">Authorized administrators only</div>
    </main>
</body>
</html>
